[project]
name = "scala-ecosystem-security-model"
version = "0.2.0"
description = "Reproducible Scala ecosystem security assessment"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "pyyaml>=6", "beautifulsoup4>=4.13", "packaging>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scala_security"]

[project.scripts]
scala-security = "scala_security.cli:main"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "types-pyyaml", "playwright"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
